# Blueprint de Render para SIGPRO. Un entorno por cohorte (sigpro-isdefe, sigpro-demo): al crear el Blueprint
# Render pide JWT_SECRET y ADMIN_KEY (sync: false) para que no queden en el repositorio.
# Ajusta los nombres de servicio y las URLs de CORS_ORIGIN / VITE_API_URL / API_URL a tu cohorte.

databases:
  - name: sigpro-db
    plan: basic-256mb
    databaseName: sigpro
    user: sigpro

services:
  # --- API (NestJS) -----------------------------------------------------------------------
  - type: web
    name: sigpro-api
    runtime: node
    plan: starter # el plan free se duerme y el primer request tarda hasta un minuto: inaceptable en clase
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api... build
    startCommand: pnpm --filter api prisma:deploy && pnpm --filter api start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: sigpro-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://sigpro-web.onrender.com
      # Crea los tenants y el seed la primera vez; después no toca nada si ya existen
      - key: SEED_ON_BOOT
        value: 'true'
      - key: SEED_STUDENT_TENANTS
        value: '25'
      # Fase 3: defectos plantados (ejercicio de reporte de defectos) y simulador del panel de misión (Socket.IO)
      - key: PLANTED_BUGS
        value: 'true'
      - key: SIMULATOR_MS
        value: '4000'
      # Opcional: basic auth para /api/docs en el entorno del curso ("usuario:contraseña")
      - key: DOCS_BASIC_AUTH
        sync: false

  # --- Web (React + Vite, sitio estático) --------------------------------------------------
  - type: web
    name: sigpro-web
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web... build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: https://sigpro-api.onrender.com/api

  # --- Reset nocturno de todos los tenants ---------------------------------------------------
  - type: cron
    name: sigpro-reset
    runtime: node
    schedule: '0 3 * * *'
    buildCommand: echo "sin dependencias que instalar"
    startCommand: node scripts/reset-all.mjs
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: API_URL
        value: https://sigpro-api.onrender.com/api
      - key: ADMIN_KEY
        sync: false
