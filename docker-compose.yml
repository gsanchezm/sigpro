services:
  db:
    image: postgres:16-alpine
    container_name: sigpro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigpro
      POSTGRES_PASSWORD: sigpro
      POSTGRES_DB: sigpro
    ports:
      - '5432:5432'
    volumes:
      - sigpro-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sigpro -d sigpro']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sigpro-db-data:
