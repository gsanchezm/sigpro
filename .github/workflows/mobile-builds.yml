name: Mobile builds (emuladores)

# Compila la app móvil para los emuladores y deja el resultado como artefacto del run:
#  - iOS: un .app para el Simulador de Xcode, comprimido en un zip (macOS runner; gratis en repositorios públicos).
#  - Android: un .apk para el emulador de Android Studio.
# No hace falta cuenta de Expo ni de Apple Developer. Se lanza a mano (Actions → «Mobile builds (emuladores)» → Run workflow)
# o con `gh workflow run mobile-builds.yml`. Cómo instalarlos: docs/MOBILE-EMULADORES.md.
#
# La URL de la API se incrusta al compilar (`EXPO_PUBLIC_API_URL`): por eso es un parámetro. Los valores por defecto sirven
# para la API local (docker compose + `pnpm --filter api start`); para apuntar a Render, pon su URL con `/api` al final.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Qué compilar
        type: choice
        options: [both, ios, android]
        default: both
      ios_api_url:
        description: API para el simulador de iOS (localhost es la Mac)
        default: http://localhost:3000/api
      android_api_url:
        description: API para el emulador de Android (10.0.2.2 es la máquina anfitriona)
        default: http://10.0.2.2:3000/api
      tenant:
        description: Tenant por defecto de la pantalla de acceso
        default: demo
      ios_archs:
        description: Arquitecturas del simulador (arm64 = Mac Apple Silicon, x86_64 = Mac Intel)
        default: arm64 x86_64
      version:
        description: Versión para publicar una Release (p. ej. v1.0.0). Vacío = solo artefactos del run
        default: ''
      release_notes:
        description: Notas de la Release (opcional; se añaden a las autogeneradas)
        default: ''
      draft:
        description: Crear la Release como borrador (sin tag público); úsalo en la primera prueba
        type: boolean
        default: false

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_TENANT: ${{ inputs.tenant }}

jobs:
  # Con `version` se comprueba antes de gastar minutos de macOS: formato vX.Y.Z y que ni el tag ni la Release existan (no se pisa nada).
  # Sin `version` no hace nada y la salida queda vacía: el workflow se comporta como siempre (solo artefactos).
  prepare:
    name: Comprobar la versión
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        name: Validar la versión
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "Sin versión: solo se dejan artefactos del run, no se publica Release"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión no tiene el formato vX.Y.Z (p. ej. v1.0.0)"
            exit 1
          fi
          # Se lista y se compara la línea exacta (here-string, no `| grep -q`: con pipefail el SIGPIPE daría un falso negativo).
          # Un error de gh o de la API rompe el paso por `set -e`: nunca se lee como «la versión está libre».
          RELEASES="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -qxF "$VERSION" <<< "$RELEASES"; then
            echo "::error::Ya existe una Release con esa versión: elige otra (no se pisa)"
            exit 1
          fi
          TAGS="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION" --jq '.[].ref')"
          if grep -qxF "refs/tags/$VERSION" <<< "$TAGS"; then
            echo "::error::Ya existe un tag con esa versión: elige otra (no se pisa)"
            exit 1
          fi
          echo "Se publicará la Release $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ios-simulator:
    name: iOS · Simulador (.app en zip)
    needs: prepare
    if: ${{ inputs.platforms != 'android' }}
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.ios_api_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # La app móvil consume `@sigpro/shared` desde su `dist`
      - name: Compilar @sigpro/shared
        run: pnpm --filter @sigpro/shared build

      # Con `version`, la app lleva el mismo número que la Release; el cambio es solo del runner (no se commitea)
      - name: Versión de la app (solo CI, no se commitea)
        if: ${{ needs.prepare.outputs.version != '' }}
        working-directory: apps/mobile
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "const fs = require('fs'); const f = 'app.json'; const j = JSON.parse(fs.readFileSync(f, 'utf8')); j.expo.version = process.env.VERSION.slice(1); fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n')"
          grep -n '"version"' app.json

      # Genera `apps/mobile/ios` (ignorado por git) a partir de app.json y ejecuta `pod install`
      - name: Proyecto nativo (expo prebuild)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --clean

      # Release: el JavaScript va dentro del .app. Un Debug buscaría Metro en la Mac y no abriría sin él.
      - name: Compilar para el simulador
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          WORKSPACE="$(ls -d ./*.xcworkspace | head -n 1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS="${{ inputs.ios_archs }}" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            -quiet build

      - name: Comprobar el .app
        run: |
          set -euo pipefail
          APP="$(find apps/mobile/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          BIN="$APP/$(basename "$APP" .app)"
          echo "Arquitecturas: $(lipo -archs "$BIN")"
          test -f "$APP/main.jsbundle"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' "$APP/Info.plist"
          # La URL de la API se incrusta al compilar: si no está en el bundle, la app abriría pero no podría iniciar sesión
          if grep -a -q -F "$EXPO_PUBLIC_API_URL" "$APP/main.jsbundle"; then echo "URL de la API en el bundle: $EXPO_PUBLIC_API_URL"; else echo "::warning::No se encontró $EXPO_PUBLIC_API_URL en main.jsbundle"; fi

      - name: Empaquetar
        run: |
          mkdir -p dist-ios
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist-ios/sigpro-ios-simulator.zip
          ls -lh dist-ios

      - uses: actions/upload-artifact@v4
        with:
          name: sigpro-ios-simulator
          path: dist-ios/sigpro-ios-simulator.zip
          if-no-files-found: error
          retention-days: 30

  android-emulator:
    name: Android · Emulador (.apk)
    needs: prepare
    if: ${{ inputs.platforms != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.android_api_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar @sigpro/shared
        run: pnpm --filter @sigpro/shared build

      - name: Versión de la app (solo CI, no se commitea)
        if: ${{ needs.prepare.outputs.version != '' }}
        working-directory: apps/mobile
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "const fs = require('fs'); const f = 'app.json'; const j = JSON.parse(fs.readFileSync(f, 'utf8')); j.expo.version = process.env.VERSION.slice(1); fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n')"
          grep -n '"version"' app.json

      - name: Proyecto nativo (expo prebuild)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean

      # Un solo APK con las dos ABI de los emuladores (x86_64 en PC/Mac Intel, arm64-v8a en Mac Apple Silicon)
      - name: Compilar el APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a --no-daemon

      - name: Comprobar el APK
        run: |
          set -euo pipefail
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p dist-android
          cp "$APK" dist-android/sigpro-android-emulator.apk
          unzip -l dist-android/sigpro-android-emulator.apk | grep -E 'lib/(x86_64|arm64-v8a)/libhermes' || true
          # La URL de la API se incrusta al compilar: sin ella (o con el `localhost` de reserva) el APK instalaría pero no iniciaría sesión
          if unzip -p dist-android/sigpro-android-emulator.apk assets/index.android.bundle | grep -a -q -F "$EXPO_PUBLIC_API_URL"; then echo "URL de la API en el bundle: $EXPO_PUBLIC_API_URL"; else echo "::warning::No se encontró $EXPO_PUBLIC_API_URL en el bundle"; fi
          ls -lh dist-android

      - uses: actions/upload-artifact@v4
        with:
          name: sigpro-android-emulator
          path: dist-android/sigpro-android-emulator.apk
          if-no-files-found: error
          retention-days: 30

  # Solo con `version`, y solo si CADA plataforma pedida terminó en success: un fallo, una cancelación o un tiempo agotado
  # de cualquiera impide publicar (nunca una Release a medias). Las plataformas que `platforms` deja fuera no cuentan.
  release:
    name: Publicar la Release
    needs: [prepare, ios-simulator, android-emulator]
    if: ${{ !cancelled() && needs.prepare.outputs.version != '' && (inputs.platforms == 'android' || needs.ios-simulator.result == 'success') && (inputs.platforms == 'ios' || needs.android-emulator.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # `prepare` solo tiene lectura y no ve los borradores; este job sí (escribe). Sin esta guarda, un borrador viejo con la
      # misma versión se publicaría con su texto y su commit antiguos. Hay que publicarlo o borrarlo antes de relanzar.
      - name: Comprobar que no queda otra Release (borradores incluidos) con esa versión
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASES="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -qxF "$VERSION" <<< "$RELEASES"; then
            echo "::error::Ya hay una Release o un borrador con esa versión: publícalo o bórralo antes de relanzar"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: sigpro-*
          path: artifacts
          merge-multiple: true

      # Las notas y las URLs viajan por `env`, nunca dentro del script: un `$(…)` o unas comillas en ellas no se ejecutan
      - name: Texto de la Release
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          IOS_API: ${{ inputs.ios_api_url }}
          ANDROID_API: ${{ inputs.android_api_url }}
        run: |
          set -euo pipefail
          {
            if [ -n "$RELEASE_NOTES" ]; then printf '%s\n\n' "$RELEASE_NOTES"; fi
            printf '%s\n\n' 'Builds para los emuladores, sin firmar y sin cuenta de Expo ni de Apple. La URL de la API se incrusta al compilar.'
            if [ -f artifacts/sigpro-android-emulator.apk ]; then printf '%s\n' "- \`sigpro-android-emulator.apk\`: emulador de Android (x86_64 y arm64-v8a). API: \`$ANDROID_API\`"; fi
            if [ -f artifacts/sigpro-ios-simulator.zip ]; then printf '%s\n' "- \`sigpro-ios-simulator.zip\`: Simulador de Xcode (.app en zip). API: \`$IOS_API\`"; fi
            printf '\n%s\n' "Cómo instalarlos: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/MOBILE-EMULADORES.md"
          } > release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SIGPRO ${{ needs.prepare.outputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          body_path: release-body.md
          files: artifacts/*
          fail_on_unmatched_files: true
