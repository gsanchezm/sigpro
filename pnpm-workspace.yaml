packages:
  - apps/*
  - packages/*
  - e2e

# pnpm 11 bloquea los scripts de instalación por defecto; estos están permitidos
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
